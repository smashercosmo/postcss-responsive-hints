packages:
  - .github
  - packages/*
  - apps/*

hoist: false
saveExact: true
cleanupUnusedCatalogs: true
catalogMode: strict

versioning:
  changelog:
    storage: repository

catalogs:
  types:
    "@types/node": 26.2.0
    "@pnpm/types": 1101.9.0
    "@octokit/webhooks-types": 7.6.1
    "@octokit/types": 17.0.0
    "@types/http-proxy": 1.17.17
    type-fest: 5.8.0
    '@verdaccio/types': 13.0.6
  dev:
    vite: 8.2.2
    vitest: 4.1.11
    typescript: 7.0.2
    actions-up: 1.17.1
    turbo: 2.10.11
    "@pshevche/act-test-runner": 1.1.0
    clean-publish: 7.1.0
    tsdown: 0.22.14
    postcss: 8.5.26
    commitizen: 4.3.2
    cz-conventional-changelog: 3.3.0
    "@commitlint/cli": 21.2.2
    "@commitlint/cz-commitlint": 21.2.2
    oxfmt: 0.64.0
    http-proxy: 1.18.1
    msw: 2.15.0
    "@mswjs/http-middleware": 0.10.3
    verdaccio: 6.10.0
  actions:
    "@actions/core": 3.0.1
    "@actions/github": 9.1.1
    "@octokit/auth-app": 8.3.0
    "@actions/exec": 3.0.0
    '@octokit/plugin-rest-endpoint-methods': 18.0.0
  lint:
    oxlint: 1.79.0
    eslint-plugin-no-only-tests: 3.4.0
    eslint-plugin-perfectionist: 5.10.1
    eslint-plugin-react-hooks: 7.1.1
    eslint-plugin-unused-imports: 4.4.1
    yaml-eslint-parser: 2.1.0
    eslint-plugin-github-action: 0.3.0

allowBuilds:
  msw: true
  node: true
