packages:
  - packages/*
  - apps/*

hoist: false
saveExact: true
cleanupUnusedCatalogs: true

versioning:
  changelog:
    storage: repository

catalogs:
  types:
    "@types/node": 26.6.6
  test:
    vitest: 5.1.0
  dev:
    astro: 7.4.12
    "@smashercosmo/configs": 0.2.0
    vite: 8.3.8
    typescript: 7.0.2
    tsdown: 0.23.7
    postcss: 8.5.33
    oxfmt: 0.78.0
  ui:
    microlighter: 2.2.0
  lint:
    oxlint: 1.93.0
    oxlint-tsgolint: 7.0.2007
    eslint-plugin-regexp: 3.3.3

minimumReleaseAgeExclude:
  - "@smashercosmo/configs@0.2.0"
