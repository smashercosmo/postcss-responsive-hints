name: PR check

env:
  # errexit - exit immediately if any command fails
  # nounset - error on use of undefined variables
  # pipefail - pipeline fails if any command in it fails, not just the last one
  SHELLOPTS: errexit:nounset:pipefail

defaults:
  run:
    shell: bash

permissions: {}

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, test, and check changes
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          with_run_install: 'true'

      - name: Generates changesets (only for tests)
        if: env.ACT == 'true' && env.GENERATE_CHANGESETS == 'true'
        run: .github/tests/__scripts__/add-mock-changeset.sh
        env:
          FEATURE_BRANCH_NAME: ${{ vars.FEATURE_BRANCH_NAME }}
          CHANGESET_DESCRIPTION: ${{ vars.CHANGESET_DESCRIPTION }}

      - name: Check for the presence of changesets files
        id: changesets
        run: .github/scripts/get-changeset-status.sh

      - name: Check feature branch
        if: github.head_ref != vars.RELEASE_BRANCH_NAME
        run: |
          if [ "${{ steps.changesets.outputs.has_changesets }}" = 'false' ]; then
            echo "No changesets found. Please run 'pnpm changeset add' and push the changes."
            exit 1
          fi

      - name: Check release branch
        if: github.head_ref == vars.RELEASE_BRANCH_NAME
        run: |
          if [ "${{ steps.changesets.outputs.has_changesets }}" = 'true' ]; then
            echo "Found changesets on the release branch. There is something wrong with your workflow"
            exit 1
          fi