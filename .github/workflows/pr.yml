name: General Pull Request Workflow

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

jobs:
  lint:
    name: Runs eslint and oxlint checks
    needs: [check-for-pending-change-files, guard-against-manual-release]
    # Run whenever this isn't a manual release, independent of check-for-pending-change-files'
    # result. That job blocks merge on its own (as a required status check on main); we don't
    # want a missing changeset to also hold back lint/test feedback on the code itself.
    if: |
      always() &&
      needs.guard-against-manual-release.result == 'success' &&
      needs.guard-against-manual-release.outputs.is-manual-release == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: true

      - run: pnpm lint

  test:
    name: Runs tests (except for the github actions tests)
    needs: [check-for-pending-change-files, guard-against-manual-release]
    if: |
      always() &&
      needs.guard-against-manual-release.result == 'success' &&
      needs.guard-against-manual-release.outputs.is-manual-release == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: true

      - run: pnpm test:ci
