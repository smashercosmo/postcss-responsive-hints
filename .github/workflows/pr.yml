name: PR check

env:
  # errexit - exit immediately if any command fails
  # nounset - error on use of undefined variables
  # pipefail - pipeline fails if any command in it fails, not just the last one
  SHELLOPTS: errexit:nounset:pipefail

defaults:
  run:
    shell: bash

permissions: {}

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

jobs:
  check-for-changes:
    name: Check for the presence of pending change files
    environment: release
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref != vars.RELEASE_BRANCH_NAME
    outputs:
      has-pending-changes: ${{ steps.status.outputs.has-pending-changes }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            pnpm-workspace.yaml
            pnpm-lock.yaml
            package.json
            .changeset
            .github

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - name: Check pending changes
        id: status
        uses: ./.github/actions/check-change-status

      - name: Check non-release branch
        run: |
          if [ "${{ steps.status.outputs.has-pending-changes }}" = 'false' ]; then
            echo "No changesets found. Please run 'pnpm change' and push the generated change files."
            exit 1
          fi

  lint-and-test:
    name: Lint changes and run tests
    needs: check-for-changes
    if: needs.check-for-changes.outputs.has-pending-changes == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: true
          token: ""

      # Ideally these two steps should be executed in parallel
      # but `act` doesn't support it at the moment
      # https://github.com/nektos/act/issues/6124
      - run: pnpm lint
      - run: pnpm test:ci
