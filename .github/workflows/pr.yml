name: Common PR workflow

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: true

      # Ideally these two steps should be executed in parallel
      # but `act` doesn't support it at the moment
      # https://github.com/nektos/act/issues/6124
      - run: pnpm lint
      - run: pnpm test:ci

  check-for-pending-change-files:
    environment: release
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref != vars.RELEASE_BRANCH_NAME
    outputs:
      has-pending-change-files: ${{ steps.check.outputs.has-pending-change-files }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false

      - id: check
        uses: ./.github/actions/check-for-pending-change-files

  require-pending-change-files:
    needs: check-for-pending-change-files
    environment: release
    runs-on: ubuntu-latest
    if: needs.check-for-pending-change-files.outputs.has-pending-change_files == false
    steps:
    - run: |
        echo "::error::No pending change files found. Please run 'pnpm change' and push the generated change files."
        exit 1