name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  check-for-pending-change-files:
    environment: release
    runs-on: ubuntu-latest
    outputs:
      has-pending-change-files: ${{ steps.check.outputs.has-pending-change-files }}
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        id: setup
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          install: true

      - id: check
        uses: ./.github/actions/check-for-pending-change-files

  require-pending-change-files:
    needs: check-for-pending-change-files
    outputs:
      has-pending-change-files: ${{ needs.check-for-pending-change-files.outputs.has-pending-change-files }}
    environment: release
    runs-on: ubuntu-latest
    if: needs.check-for-pending-change-files.outputs.has-pending-change-files == 'false'
    steps:
      - run: |
          echo "::error::No pending change files found. Please run 'pnpm change' and push the generated change files."
          exit 1


  version-bumps-and-changelog-updates:
    needs: check-for-pending-change-files
    if: needs.check-for-pending-change-files.outputs.has-pending-change-files == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        id: setup
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          install: true

      - uses: ./.github/actions/spin-up-verdaccio-server
        id: verdaccio-server

      - uses: ./.github/actions/bump-versions-and-update-changelogs
        id: version
        with:
          release-branch-name: ${{ vars.RELEASE_BRANCH_NAME }}
          private-registry-url: ${{ steps.verdaccio-server.outputs.url }}





