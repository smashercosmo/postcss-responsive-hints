name: Docs

# Builds the docs site, apps/docs, and deploys it to GitHub Pages.
#
# The release workflow calls this after every run. It deploys the docs of the
# released version: the commit of the `v<version>` tag of the version in
# packages/postcss-responsive-hints/package.json. That tag only exists once the
# version is on npm, so the docs always match npm, and nothing is deployed
# while a version waits for its release. `on: release` can't be used instead:
# the releases are created with GITHUB_TOKEN, which doesn't trigger workflows.
#
# Running it manually deploys the selected branch as it is, e.g. main before
# the first release.
#
# Settings → Pages → Source must be "GitHub Actions".
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  # Decides what to deploy: the tag of the released version, the branch of a
  # manual run, or nothing
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      # Full history with tags, to find the tag of the released version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: ref
        name: Find the ref to deploy
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$(jq -r .version packages/postcss-responsive-hints/package.json)"

          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$tag isn't released yet, so the docs aren't deployed"
          fi

  build:
    needs: version
    if: needs.version.outputs.ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.ref }}

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          require-lockfile: true

      - run: pnpm --filter docs build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
