name: GitHub token
description: Generates GitHub App installation access token

inputs:
  client-id:
    description: GitHub App client ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  permission-contents:
    description: Contents permission for the GitHub App token
    required: false
  permission-pull-requests:
    description: Pull requests permission for the GitHub App token
    required: false

outputs:
  token:
    description: GitHub App installation access token
    value: ${{ steps.generate-token-ci.outputs.token }}
  app-slug:
    description: GitHub App slug
    value: ${{ steps.generate-token-ci.outputs.app-slug }}

runs:
  using: composite
  steps:
    - name: Generate GitHub token (CI)
      id: generate-token-ci
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        github-api-url: ${{ github.api_url }}
