name: Setup project
description: Generate GitHub token, configure GIT, install pnpm, setup Node, install dependencies

inputs:
  client-id:
    description: GitHub App client ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  permission-contents:
    description: Contents permission for the GitHub App token
    required: false
  permission-pull-requests:
    description: Pull requests permission for the GitHub App token
    required: false
  pnpm_install:
    description: Should install packages
    required: true
    default: "false"


outputs:
  token:
    description: GitHub App installation access token
    value: ${{ steps.generate-token.outputs.token }}
  app-slug:
    description: GitHub App slug
    value: ${{ steps.generate-token.outputs.app-slug }}

runs:
  using: composite
  steps:
    - name: Generate GitHub token
      id: generate-token
      uses: ./.github/actions/generate-token
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}

    - name: Configure Git Identity
      id: git-identity
      shell: bash
      run: .github/scripts/configure-git-identity.sh
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}

    - name: Install pnpm
      uses: ./.github/actions/setup-pnpm
      with:
        pnpm_install: ${{ inputs.pnpm_install }}

    - name: Setup Node.js (CI)
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: package.json