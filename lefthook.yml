rc: ./.lefthookrc

commit-msg:
  jobs:
    - group:
        jobs:
          - name: Lint commits
            only:
              - run: |
                  [ "$(is_changeset_commit .git/COMMIT_EDITMSG)" = "false" ]
            run: pnpm commitlint --edit {1} --extends @postcss-responsive-hints/commitlint/default

          - name: Lint changesets commits
            only:
              - run: |
                  [ "$(is_changeset_commit .git/COMMIT_EDITMSG)" = "true" ]
            run: pnpm commitlint --edit {1} --extends @postcss-responsive-hints/commitlint/changesets


